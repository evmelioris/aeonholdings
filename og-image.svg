<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f43"/>
      <stop offset="0.55" stop-color="#16283a"/>
      <stop offset="1" stop-color="#101d2b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="#ffffff"/>
  <!-- Design band: 630 tall, vertically centered (y 285..915) for a clean center-crop -->
  <g transform="translate(0,285)">
    <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="6" fill="#b08a4f"/>
    <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="6" fill="#c9a769">AEON HOLDINGS</text>
    <text x="78" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#ffffff">Acquiring and operating</text>
    <text x="78" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#ffffff">one exceptional business</text>
    <text x="78" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#ffffff">for the long term.</text>
    <rect x="80" y="512" width="70" height="3" fill="#b08a4f"/>
    <text x="80" y="562" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#aeb9c3">A patient, owner-operated home for a company built to last.</text>
  </g>
